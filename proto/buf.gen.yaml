# Sinh mã client gRPC từ hợp đồng chép của ViGov. Chạy: `make proto` (tức `cd proto && buf generate`).
#
# Mã sinh ra nằm ở internal/gen/ và KHÔNG ĐƯỢC SỬA TAY — sửa .proto rồi sinh lại.
#
# go_package ghi đè bằng chế độ managed: tệp .proto chép nguyên văn không mang go_package nào,
# và thêm một dòng vào nó là làm lệch sha với nguồn. Tiền tố trỏ vào module CỦA KHO NÀY, không
# phải module của ViGov — không một đường import nào sang kho kia.
#
# Phiên bản plugin GHIM, trùng với bản ViGov đã dùng để sinh phía máy chủ (protoc-gen-go
# v1.36.12, protoc-gen-go-grpc v1.6.2 — đầu tệp core/gen/... bên ấy). Không ghim thì hai lần
# `make proto` cách nhau một tháng cho ra hai mã khác nhau từ cùng một hợp đồng.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/vihat/vihat-miniapp/internal/gen
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: ../internal/gen
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.6.2
    out: ../internal/gen
    opt: paths=source_relative
