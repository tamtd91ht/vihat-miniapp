# vihat-miniapp — Secret MẪU (hai giá trị BÍ MẬT).
#
# ĐỌC HẾT KHỐI NÀY TRƯỚC KHI DÙNG.
#
# Cách dùng ĐƯỢC KHUYẾN NGHỊ là KHÔNG dùng tệp này để tạo Secret. Hãy dùng
# `kubectl create secret generic ... --from-file` (xem deploy/README.md): một
# tệp YAML đã điền secret thật là một tệp nằm lại trên đĩa, trôi vào bản sao lưu
# thư mục làm việc, và sớm muộn trôi vào một kho git nào đó.
#
# Tệp này tồn tại để trả lời đúng MỘT câu hỏi: Secret phải có những KHOÁ nào và
# tên của nó là gì. Giá trị thì không bao giờ ở đây.
#
# Nếu vẫn chọn đường YAML: chép ra NGOÀI kho (ví dụ ~/bi-mat/), điền, apply, rồi
# xoá tệp đã điền. `.gitignore` chặn mọi tệp secret không phải *.example trong
# thư mục này, nhưng nó không chặn được một tệp bạn để ở chỗ khác.
#
# Dùng stringData (không phải data) để không phải base64 bằng tay — base64 làm
# người ta gõ nhầm trong im lặng, và nó KHÔNG phải mã hoá: ai đọc được Secret
# thì đọc được giá trị.
apiVersion: v1
kind: Secret
metadata:
  name: vihat-miniapp-bi-mat
  namespace: <dien-vao-namespace>
  labels:
    app.kubernetes.io/name: vihat-miniapp
type: Opaque
stringData:
  # DSN Postgres — DẠNG CỤM NGAY TỪ DÒNG ĐẦU.
  #
  # Hình dạng phải viết (một dòng, không xuống dòng); phần trong NGOẶC NHỌN là
  # chỗ điền, mật khẩu đứng ngay sau tên người dùng và ngăn bằng dấu hai chấm:
  #
  #   scheme            postgres
  #   định danh         <nguoi-dung> : <mat-khau>
  #   DANH SÁCH host    <host-1>:5432,<host-2>:5432        <- dấu phẩy, nhiều host
  #   CSDL              /<ten-csdl>
  #   tham số           ?sslmode=verify-full
  #                     &target_session_attrs=read-write
  #                     &connect_timeout=5
  #
  # Vì sao DANH SÁCH host kể cả khi hôm nay chỉ có một node: viết một host rồi
  # "sau thêm sau" là thứ trông đúng suốt thời gian còn một node và sai đúng vào
  # ngày chuyển sang HA — lúc ấy cụm có nhiều thành viên mà dịch vụ chỉ nói
  # chuyện được với một, và triệu chứng không giống lỗi cấu hình chút nào.
  #
  #   target_session_attrs=read-write : bỏ qua replica chỉ-đọc, luôn tìm primary.
  #        Thiếu nó, một lần failover có thể để service nối vào replica và mọi
  #        lượt đăng nhập hỏng ở câu INSERT đầu tiên.
  #   sslmode=verify-full : mã hoá VÀ xác thực máy chủ; cần sslrootcert trỏ tới
  #        CA đã mount (xem deploy/README.md). Không mount được CA thì tối thiểu
  #        là sslmode=require — và phải biết require chỉ mã hoá chứ KHÔNG chứng
  #        minh bạn đang nói chuyện với đúng CSDL của mình.
  #   connect_timeout=5 : thiếu nó thì một node chết làm lời gọi treo tới tận
  #        timeout của HTTP server.
  DATABASE_DSN: "<dien-vao-dsn-postgres-dang-cum-theo-hinh-dang-o-tren>"

  # Secret key của Mini App, lấy từ trang quản trị Zalo Mini App.
  # Không có nó thì không đổi được phoneToken sang số điện thoại, tức là KHÔNG
  # AI ĐĂNG NHẬP ĐƯỢC. Đây chính là giá trị mà kiểu internal/secret.Secret tồn
  # tại để chặn mọi đường in ra.
  ZALO_MINIAPP_SECRET_KEY: "<dien-vao-secret-key-mini-app>"
